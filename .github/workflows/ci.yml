name: ci

# Each job runs a preset, not a hand-rolled configure. A preset carries the
# warning set, the generator and the test options; a bare `cmake -S . -B build`
# produces an untyped build without -Werror, which is how a -Wswitch defect once
# reached a gate. The jobs mirror the host gate's rows: Linux debug and release,
# plus the clang and sanitizer configurations that the gate does not reach.
#
# The executed tests need the sibling VM repositories, which are not present
# here, so they are not registered and the suite still passes.

on:
  push:
  pull_request:

jobs:
  linux-gcc-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux-gcc-debug
      - name: Build
        run: cmake --build --preset linux-gcc-debug --parallel
      - name: Test
        run: ctest --preset linux-gcc-debug --output-on-failure

  linux-gcc-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux-gcc-release
      - name: Build
        run: cmake --build --preset linux-gcc-release --parallel
      - name: Test
        run: ctest --preset linux-gcc-release --output-on-failure

  linux-clang-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux-clang-debug
      - name: Build
        run: cmake --build --preset linux-clang-debug --parallel
      - name: Test
        run: ctest --preset linux-clang-debug --output-on-failure

  linux-sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux-sanitize
      - name: Build
        run: cmake --build --preset linux-sanitize --parallel
      - name: Test
        run: ctest --preset linux-sanitize --output-on-failure

  windows-msvc-debug:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc-debug
      - name: Build
        run: cmake --build --preset windows-msvc-debug --parallel
      - name: Test
        run: ctest --preset windows-msvc-debug --output-on-failure

  windows-msvc-release:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc-release
      - name: Build
        run: cmake --build --preset windows-msvc-release --parallel
      - name: Test
        run: ctest --preset windows-msvc-release --output-on-failure
  # The executed kr232 rows need the emulator, and the emulator is a sibling
  # repository, so the suite above never registers them. This job builds the
  # emulator and points the compiler at it.
  kr232-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the compiler
        uses: actions/checkout@v4
        with:
          path: krcompiler
      - name: Check out the emulator
        uses: actions/checkout@v4
        with:
          repository: kevinwross/kr232
          path: kr232
      - name: Build the emulator
        run: |
          cmake -S kr232 -B kr232/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build kr232/build --parallel
      - name: Configure the compiler with the emulator
        run: |
          cmake -S krcompiler -B krcompiler/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DKRC_KR232_VM="$PWD/kr232/build/kr232-emu" \
            -DKRC_KR232_BLANK_IMAGE="$PWD/kr232/tests/fixtures/blank-flip.k232"
      - name: Build
        run: cmake --build krcompiler/build/ci --parallel
      - name: kr232 rows
        run: ctest --test-dir krcompiler/build/ci -R kr232 --output-on-failure